name: Metrics

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          
          user: JoJoBot420
          template: classic
          base: header, repositories, metadata
          config_timezone: Israel/Jerusalem

          # --- THEME & DESIGN ---
          config_theme: tokyonight

          # --- MUSIC (Last.fm - Recent Tracks) ---
          plugin_music: yes
          plugin_music_provider: lastfm
          plugin_music_mode: recent
          plugin_music_limit: 5
          plugin_music_user: JoJoBot420
          plugin_music_token: ${{ secrets.LASTFM_API_KEY }}

          # --- LANGUAGES & CODE ---
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage, bytes-size

          # --- LINES (Fixed) ---
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base, history, repositories

          # --- 3D ISOMETRIC CALENDAR ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- CODING HABITS & TIME ---
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_tz: Israel/Jerusalem

          # --- ACHIEVEMENTS & BADGES ---
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: X

          # --- MISC ---
          plugin_gists: yes
          repositories_forks: yes
